<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flower Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff5f8;
        }

        nav {
            background: linear-gradient(135deg, #ff758c, #ff7eb3, #6a89cc);
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        nav a {
            display: inline-block;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            margin: 0 15px;
            padding: 12px 30px;
            border-radius: 50px;
            background: rgba(255,255,255,0.2);
            transition: 0.4s;
        }

        nav a:hover {
            background: white;
            color: #ff4f81;
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }

        .welcome {
            text-align: center;
            padding: 50px;
        }

        .welcome h1 {
            color: #ff4f81;
            font-size: 45px;
        }

        .welcome p {
            color: #555;
            font-size: 20px;
            margin-top: 15px;
        }

        .flower-box {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 30px;
        }

        .card {
            width: 220px;
            padding: 25px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .card h2 {
            color: #ff6b81;
        }

        .card p {
            color: #666;
            margin-top: 10px;
        }

        footer {
            margin-top: 50px;
            background: #ff6f91;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="flower.html">Flower</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section class="welcome">
        <h1> Welcome to Flower World </h1>
        <p> A local flower shop offers fresh, vibrant blooms and custom arrangements to brighten any special occasion or everyday moment. </p>
        <p>Beautiful flowers to make your day brighter and happier.</p>

       
    </section>

    <footer>
        Flower World | All Rights Reserved
    </footer>

</body>
</html>
