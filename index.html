<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flower Website</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        body {
            background: #fff5f8;
        }


        /* Navigation */

        nav {
            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3,
                #6a89cc
            );

            padding: 20px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0,0,0,0.2);

            position: relative;
            z-index: 10;
        }


        nav a {
            display: inline-block;

            color: white;

            text-decoration: none;

            font-size: 20px;

            font-weight: bold;

            margin: 0 15px;

            padding: 12px 30px;

            border-radius: 50px;

            background: rgba(255,255,255,0.2);

            transition: 0.4s;
        }


        nav a:hover {
            background: white;

            color: #ff4f81;

            transform: scale(1.1);

            box-shadow: 0 5px 15px rgba(0,0,0,0.25);
        }


        /* Home Background */

        .hero {
            min-height: 600px;

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding: 60px 20px;

            position: relative;

            background-image:
                linear-gradient(
                    rgba(255, 117, 140, 0.35),
                    rgba(106, 137, 204, 0.45)
                ),
                url("flower-bg.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;
        }


        /* Text Area */

        .welcome {
            max-width: 900px;

            background: rgba(255,255,255,0.88);

            padding: 45px;

            border-radius: 25px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.25);

            backdrop-filter: blur(3px);
        }


        .welcome h1 {
            color: #ff4f81;

            font-size: 50px;

            margin-bottom: 20px;
        }


        .welcome p {
            color: #555;

            font-size: 20px;

            line-height: 1.7;

            margin-top: 12px;
        }


        /* Flower Cards */

        .flower-box {
            display: flex;

            justify-content: center;

            gap: 25px;

            margin-top: 30px;
        }


        .card {
            width: 220px;

            padding: 25px;

            background: white;

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 5px 15px rgba(0,0,0,0.15);

            transition: 0.3s;
        }


        .card:hover {
            transform: translateY(-10px);
        }


        .card h2 {
            color: #ff6b81;
        }


        .card p {
            color: #666;

            margin-top: 10px;
        }


        /* Footer */

        footer {
            background: #ff6f91;

            color: white;

            text-align: center;

            padding: 15px;

            margin-top: 0;
        }


        /* Mobile */

        @media (max-width: 600px) {

            nav {
                padding: 15px 5px;
            }


            nav a {
                font-size: 16px;

                margin: 5px;

                padding: 10px 18px;
            }


            .hero {
                min-height: 550px;

                padding: 30px 15px;
            }


            .welcome {
                padding: 30px 20px;
            }


            .welcome h1 {
                font-size: 34px;
            }


            .welcome p {
                font-size: 17px;
            }

        }

    </style>

</head>


<body>


    <!-- Navigation -->

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="flower.html">
            Flower
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>


    <!-- Home Hero Section -->

    <section class="hero">

        <div class="welcome">

            <h1>
                Welcome to Flower World 
            </h1>


            <p>
                A local flower shop offers fresh, vibrant blooms
                and custom arrangements to brighten any special
                occasion or everyday moment.
            </p>


            <p>
                Beautiful flowers to make your day brighter
                and happier. 
            </p>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        Flower World | All Rights Reserved

    </footer>


</body>
</html>
