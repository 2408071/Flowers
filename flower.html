<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flower Gallery</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #fff5f7;
    }

    header {
        background: linear-gradient(135deg, #ff6f91, #ff9671);
        color: white;
        text-align: center;
        padding: 25px;
        font-size: 28px;
        font-weight: bold;
    }

    nav {
        background: #845ec2;
        text-align: center;
        padding: 15px;
    }

    nav a {
        color: white;
        text-decoration: none;
        margin: 0 15px;
        font-weight: bold;
        font-size: 18px;
        padding: 10px 20px;
        border-radius: 25px;
        transition: 0.3s;
    }

    nav a:hover {
        background: white;
        color: #845ec2;
    }

    h2 {
        text-align: center;
        margin-top: 30px;
        color: #d63384;
        font-size: 32px;
    }

    .flowers {
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
        padding: 30px;
    }

    .flower {
        width: 220px;
        background: white;
        border-radius: 15px;
        text-align: center;
        padding: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        transition: 0.3s;
    }

    .flower:hover {
        transform: translateY(-10px);
        box-shadow: 0 10px 20px rgba(0,0,0,0.25);
    }

    .flower img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        border-radius: 15px;
    }

    .flower h3 {
        color: #ff4f81;
        font-size: 22px;
        text-transform: capitalize;
    }

    footer {
        background: linear-gradient(135deg, #ff6f91, #845ec2);
        color: white;
        text-align: center;
        padding: 15px;
        margin-top: 20px;
    }

</style>

</head>

<body>

<header>
     Beautiful Flower Gallery 
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="flower.html">Flower</a>
    <a href="contact.html">Contact</a>
</nav>


<h2>Our Flowers</h2>

<div class="flowers">

    <div class="flower">
        <img src="rose.jpg" alt="Rose">
        <h3>Rose</h3>
    </div>

    <div class="flower">
        <img src="tulip.jpg" alt="Tulip">
        <h3>Tulip</h3>
    </div>

    <div class="flower">
        <img src="sunflower.jpg" alt="Sunflower">
        <h3>Sunflower</h3>
    </div>

    <div class="flower">
        <img src="jas.jpg" alt="Jasmine">
        <h3>Jasmine Flower</h3>
    </div>

</div>


<footer>
   Flower Gallery | All Rights Reserved
</footer>

</body>
</html>
